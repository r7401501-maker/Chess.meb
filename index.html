/* ---------- шашки (русские) ---------- */
const D=[[1,1],[1,-1],[-1,1],[-1,-1]],inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8,nm=(r,c)=>'abcdefgh'[c]+(8-r);
const CI=(()=>{let s='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)s+=(r+c)%2?(r<3?'b':r>4?'w':'.'):'.';return s})();
const toB=s=>[...Array(8)].map((_,r)=>[...s.slice(r*8,r*8+8)]),fromB=b=>b.map(r=>r.join('')).join('');
function seqs(b,r,c,side,king){
  const out=[];
  for(const[dr,dc]of D){
    let y=r+dr,x=c+dc;
    if(king)while(inb(y,x)&&b[y][x]==='.'){y+=dr;x+=dc}
    if(!inb(y,x))continue;
    const t=b[y][x];
    if(t==='.'||t==='x'||t.toLowerCase()===side)continue;
    const land=[];
    for(let ly=y+dr,lx=x+dc;inb(ly,lx)&&b[ly][lx]==='.';ly+=dr,lx+=dc){land.push([ly,lx]);if(!king)break}
    const opts=land.map(([ly,lx])=>{
      const nb=b.map(a=>a.slice()),k=king||(side==='w'?ly===0:ly===7);
      nb[y][x]='x';nb[r][c]='.';nb[ly][lx]=k?side.toUpperCase():side;
      return{ly,lx,sub:seqs(nb,ly,lx,side,k)};
    });
    const cont=opts.filter(o=>o.sub.length);
    for(const o of cont.length?cont:opts){
      if(o.sub.length)for(const s of o.sub)out.push({path:[[o.ly,o.lx],...s.path],rem:[[y,x],...s.rem]});
      else out.push({path:[[o.ly,o.lx]],rem:[[y,x]]});
    }
  }
  return out;
}
function cmoves(b,side){
  const caps=[],simp=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=b[r][c];
    if(p==='.'||p.toLowerCase()!==side)continue;
    const king=p!==p.toLowerCase();
    seqs(b,r,c,side,king).forEach(s=>caps.push({from:[r,c],...s}));
    if(king){for(const[dr,dc]of D){let y=r+dr,x=c+dc;while(inb(y,x)&&b[y][x]==='.'){simp.push({from:[r,c],path:[[y,x]],rem:[]});y+=dr;x+=dc}}}
    else{const dr=side==='w'?-1:1;for(const dc of[-1,1]){const y=r+dr,x=c+dc;if(inb(y,x)&&b[y][x]==='.')simp.push({from:[r,c],path:[[y,x]],rem:[]})}}
  }
  return caps.length?caps:simp;
}
function capply(b,m,side){
  const nb=b.map(a=>a.slice()),[r,c]=m.from,p=b[r][c],e=m.path[m.path.length-1];
  nb[r][c]='.';m.rem.forEach(([y,x])=>nb[y][x]='.');
  const k=p!==p.toLowerCase()||m.path.some(([y])=>side==='w'?y===0:y===7);
  nb[e[0]][e[1]]=k?side.toUpperCase():side;
  return nb;
}

/* ---------- общий слой для обеих игр ---------- */
const INIT=k=>k==='chess'?new Chess().fen():CI;
const stAt=(g,i)=>i===0?INIT(g.kind):g.hist[i-1].s;
const myCol=g=>g.white===ME.id?'w':g.black===ME.id?'b':null;
function cells(kind,s){
  if(kind==='chess')return new Chess(s).board().map(r=>r.map(p=>p&&{t:p.type,c:p.color}));
  return toB(s).map(r=>r.map(p=>p==='.'?null:{c:p.toLowerCase(),k:p!==p.toLowerCase()}));
}
function legal(kind,s,side,q){
  if(kind==='chess')return new Chess(s).moves({square:q,verbose:true}).map(m=>({to:m.to,m}));
  const out=[];
  for(const m of cmoves(toB(s),side)){
    if(nm(...m.from)!==q)continue;
    const to=nm(...m.path[m.path.length-1]);
    if(!out.some(o=>o.to===to))out.push({to,m});
  }
  return out;
}
function applyMove(kind,s,side,o){
  if(kind==='chess'){
    const c=new Chess(s),r=c.move({from:o.m.from,to:o.m.to,promotion:o.m.promotion});
    return{n:r.san,s:c.fen(),f:o.m.from,t:o.m.to,res:c.in_checkmate()?side:(c.in_draw()||c.in_stalemate())?'d':null};
  }
  const m=o.m,nb=capply(toB(s),m,side),sep=m.rem.length?':':'-';
  return{n:[nm(...m.from),...m.path.map(p=>nm(...p))].join(sep),s:fromB(nb),f:nm(...m.from),t:o.to,res:cmoves(nb,side==='w'?'b':'w').length?null:side};
}

/* ---------- часы ---------- */
const TCS=[null,[180,2],[300,0],[600,0],[900,10]],TCN=['Без часов','Блиц 3+2','Блиц 5+0','Рапид 10+0','Рапид 15+10'];
let TC=Math.min(Math.max(+ls('ch_tc',0)||0,0),TCS.length-1),SO=0;
const nowS=()=>Date.now()+SO,claimed={};
const clk=g=>{
  const r={w:g.w_ms,b:g.b_ms};
  if(g.status==='play'&&nmv(g)>=2&&g.turn_at){const t=nmv(g)%2?'b':'w';r[t]=g[t+'_ms']-(nowS()-Date.parse(g.turn_at))}
  return r;
};
const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function chk(g){
  if(!g||g.base==null||g.status!=='play'||nmv(g)<2)return;
  const t=nmv(g)%2?'b':'w';
  if(!(clk(g)[t]<=0)||nowS()-(claimed[g.id]||0)<3000)return;
  claimed[g.id]=nowS();
  db.rpc('claim_timeout',{gid:g.id}).then(()=>refresh());
}

/* ---------- данные ----------
   Как бережём Supabase:
   1) realtime только по СВОИМ партиям и новым вызовам (а не по всем играм и всем игрокам);
   2) списки без истории ходов (поле hist тяжёлое), игроки подгружаются только нужные;
   3) редкий опрос как страховка, он молчит, когда приложение свёрнуто;
   4) в базу пишем только если что-то изменилось. */
const PL_RANK='id,name,photo,r_chess,r_dr,r_pool,wins,draws,losses,prem_until,eq,banned';
const LOB_COLS='id,kind,rated,white,black,status,result,base,inc,draw_by,created_at,n_moves,w_ms,b_ms,turn_at';
const PT={},RKC={},nmv=g=>g.hist?g.hist.length:(g.n_moves||0);
let RT=false,rP=null,rAgain=false,pollT=0,lastRef=0,pt=0;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.classList.add('out'),2600);setTimeout(()=>d.remove(),3200)}
const mergeP=r=>{
  const old=P[r.id];
  if(r.id===ME.id&&old&&typeof old.stars==='number'&&typeof r.stars==='number'&&r.stars>old.stars){toast('+'+(r.stars-old.stars)+' ★');SND('promo')}
  P[r.id]={...old,...r};PT[r.id]=Date.now();
};
// подгрузить игроков, которых нет или данные старше 45 с; must: обновить в любом случае
async function need(ids,must=[]){
  const now=Date.now(),want=new Set(must.filter(i=>i!=null));
  for(const i of ids)if(i!=null&&(!P[i]||now-(PT[i]||0)>45000))want.add(i);
  if(!want.size)return;
  const r=await db.from('players').select('*').in('id',[...want]);
  if(r.data)r.data.forEach(mergeP);
}
const later=()=>{if(pt)return;pt=setTimeout(()=>{pt=0;paint()},60)};
function upG(r){
  const i=G.findIndex(g=>g.id===r.id),keep=(r.status==='open'||r.status==='play')&&(r.status==='open'||myCol(r));
  if(!keep){if(i>=0)G.splice(i,1);return}
  if(i>=0)G[i]={...G[i],...r};else G.unshift(r);
  if(myCol(r)){const p=lobSt[r.id];if(p==='open'&&r.status==='play'&&r.id!==cur)SND('start');lobSt[r.id]=r.status}
}
async function loadLobby(){
  const me=ME.id,since=new Date(Date.now()-864e5).toISOString();
  const[o,m]=await Promise.all([
    db.from('games').select(LOB_COLS).eq('status','open').gte('created_at',since).order('created_at',{ascending:false}).limit(40),
    db.from('games').select(LOB_COLS).or(`white.eq.${me},black.eq.${me}`).in('status',['open','play']).limit(40)
  ]);
  if(o.error&&m.error)throw o.error;
  const seen={},list=[];
  for(const g of[...(m.data||[]),...(o.data||[])])if(!seen[g.id]){seen[g.id]=1;list.push(g)}
  list.sort((x,y)=>Date.parse(y.created_at)-Date.parse(x.created_at));
  G=list;
  G.forEach(g=>{if(!myCol(g))return;const p=lobSt[g.id];if(p==='open'&&g.status==='play'&&g.id!==cur)SND('start');lobSt[g.id]=g.status;chk(g)});
  await need(G.flatMap(g=>[g.white,g.black]),[me]);
}
async function loadRank(){
  const k=rk,c=RKC[k];if(c&&Date.now()-c.t<60000)return false;
  const key=RK[k],r=await db.from('players').select(PL_RANK).order(key,{ascending:false}).order('wins',{ascending:false}).limit(100);
  if(!r.data)return false;
  r.data.forEach(mergeP);RKC[k]={t:Date.now(),ids:r.data.map(p=>p.id)};
  return true;
}
async function pollGame(){
  const id=cur,r=await db.from('games').select('*').eq('id',id).maybeSingle();
  if(cur!==id||!r.data)return;
  const g=r.data,was=GM&&GM.status;
  // не затираем ход, который мы только что сделали и который ещё не успел записаться
  if(!(GM&&GM.id===id&&GM.status===g.status&&g.hist.length<GM.hist.length))GM=g;
  await need([g.white,g.black],was&&was!=='done'&&g.status==='done'?[g.white,g.black,ME.id]:[]);
  paint();
}
function refresh(){
  if(rP){rAgain=true;return rP}
  lastRef=Date.now();
  rP=(async()=>{try{if(cur)await pollGame();else{await loadLobby();if(tab==='rank')await loadRank();paint()}}catch(e){}})().finally(()=>{rP=null;if(rAgain){rAgain=false;refresh()}});
  return rP;
}
// редкий опрос: в игре и без realtime чаще, в лобби с realtime совсем редко, в фоне не опрашиваем
function sched(){
  clearTimeout(pollT);
  if(document.hidden)return;
  const inG=cur&&GM&&GM.status!=='done',ms=(inG?(RT?20000:4000):(RT?45000:15000))*(.85+Math.random()*.3);
  pollT=setTimeout(async()=>{await refresh();sched()},ms);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(pollT);else{if(db&&Date.now()-lastRef>5000)refresh();sched()}});
function onGame(p){
  if(p.eventType==='DELETE'){const id=p.old&&p.old.id;G=G.filter(g=>g.id!==id);if(cur===id){cur=null;GM=null}return later()}
  const r=p.new;if(!r)return;
  upG(r);
  if(cur===r.id&&(!GM||r.hist.length>=GM.hist.length||r.status!==GM.status)){
    const was=GM&&GM.status;GM=r;paint();
    if(was&&was!=='done'&&r.status==='done')need([r.white,r.black],[r.white,r.black,ME.id]).then(later);
  }else later();
  need([r.white,r.black]).then(later);
}
function connect(){
  db.channel('u'+ME.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'white=eq.'+ME.id},onGame)
    .on('postgres_changes',{event:'*',schema:'public',table:'games',filter:'black=eq.'+ME.id},onGame)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'games',filter:'status=eq.open'},p=>{if(p.new){upG(p.new);need([p.new.white,p.new.black]).then(later);later()}})
    .subscribe(st=>{const ok=st==='SUBSCRIBED';if(ok!==RT){RT=ok;sched()}if(ok)refresh()});
}
async function init(){
  db=supabase.createClient(SB_URL,SB_KEY);
  const sync=async()=>{try{const t0=Date.now(),r=await db.rpc('server_now');if(r.data)SO=Number(r.data)-(t0+Date.now())/2}catch(e){}};
  await sync();setInterval(()=>{if(!document.hidden)sync()},180000);
  try{if(inTG&&!ls('ch_wa','')&&tgw.isVersionAtLeast('6.9')&&!(TU&&TU.allows_write_to_pm)){lset('ch_wa','1');tgw.requestWriteAccess()}}catch(e){}
  // профиль: пишем в базу только новому игроку или если изменились имя/фото
  let mine=null,isNew=false;
  try{const r0=await db.from('players').select('*').eq('id',ME.id).maybeSingle();mine=r0.data;isNew=!r0.error&&!r0.data}catch(e){}
  if(isNew)await db.from('players').upsert({id:ME.id,name:ME.name,photo:ME.photo},{onConflict:'id',ignoreDuplicates:true});
  else if(mine&&(mine.name!==ME.name||(mine.photo||null)!==(ME.photo||null)))await db.from('players').update({name:ME.name,photo:ME.photo}).eq('id',ME.id);
  if(mine)mergeP({...mine,name:ME.name,photo:ME.photo});
  if(isNew&&inTG)fetch('/.netlify/functions/bot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tgw.initData,action:'new'})}).catch(()=>{});
  // цены магазина почти не меняются: храним на час
  try{
    let c=null;try{c=JSON.parse(ls('ch_shop','null'))}catch(e){}
    if(!c||Date.now()-c.t>36e5){const r=await db.from('shop_items').select('*').eq('active',true);if(r.data){c={t:Date.now(),d:r.data};lset('ch_shop',JSON.stringify(c))}}
    if(c)c.d.forEach(it=>{const s=SHOP[it.id];if(s){s.price=it.price;s.days=it.days;s.give=it.give}});
  }catch(e){}
  await refresh();
  connect();sched();
}
async function create(kind){
  const{data,error}=await db.from('games').insert({kind,rated:RATED,base:TCS[TC]&&kind!=='pool'?TCS[TC][0]:null,inc:TCS[TC]&&kind!=='pool'?TCS[TC][1]:0,[Math.random()<.5?'white':'black']:ME.id}).select();
  if(error)return msg(/too many/.test(error.message)?'У вас уже 3 открытых вызова. Отмените лишние.':'Ошибка: '+error.message);
  upG(data[0]);notify(data[0]);openGame(data[0].id,data[0]);
}
async function accept(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  const{data,error}=await db.from('games').update({[g.white?'black':'white']:ME.id,status:'play'}).eq('id',id).eq('status','open').select();
  if(error||!data||!data.length){msg('Этот вызов уже недоступен: его принял другой игрок или создатель отменил.');return refresh()}
  upG(data[0]);GM=data[0];cur=id;vw=null;sel=null;opts=[];SND('start');paint();need([GM.white,GM.black]).then(later);sched();
}
async function openGame(id,row){
  PR=null;cur=id;vw=null;sel=null;opts=[];
  const k=row||G.find(g=>g.id===id);
  GM=k&&k.hist?k:null;
  if(GM)paint();
  else{
    const r=await db.from('games').select('*').eq('id',id).maybeSingle();
    if(cur!==id)return;
    if(!r.data){cur=null;paint();return refresh()}
    GM=r.data;
  }
  await need([GM.white,GM.black]);
  if(cur===id)paint();
  sched();
}
function tap(q){
  const g=GM;if(!g||cur!==g.id)return;
  const N=g.hist.length,col=myCol(g);
  if(g.status!=='play'||col!==(N%2?'b':'w')||(vw!==null&&vw!==N))return;
  const s=stAt(g,N),os=sel?opts.filter(o=>o.to===q):[];
  if(os.length>1){PR={g,s,col,os};return paint()}
  if(os.length)return doMove(g,s,col,os[0]);
  const l=legal(g.kind,s,col,q);
  if(l.length){sel=q;opts=l}else{sel=null;opts=[]}
  paint();
}
async function doMove(g,s,col,o){
  const r=applyMove(g.kind,s,col,o),hist=[...g.hist,{n:r.n,s:r.s,f:r.f,t:r.t}];
  const ex={};
  if(g.base!=null){const t=g.hist.length%2?'b':'w';ex.turn_at=new Date(nowS()).toISOString();if(g.hist.length>=2)ex[t+'_ms']=Math.max(0,g[t+'_ms']-(nowS()-Date.parse(g.turn_at)))+g.inc*1000}
  sel=null;opts=[];vw=null;GM={...g,hist,draw_by:null,...ex};paint();
  const{data:ud,error}=await db.from('games').update({hist,draw_by:null}).eq('id',g.id).select();
  if(error){if(/time over/.test(error.message)){chk(g);return refresh()}msg('Ход не отправлен: '+error.message);return refresh()}
  if(ud&&ud[0]&&cur===g.id&&GM&&ud[0].hist.length>=GM.hist.length){GM=ud[0];paint()}
  if(r.res){await db.rpc('finish_game',{gid:g.id,res:r.res});refresh()}
}

  slide(e.f,e.t,rev);
  if(rev)return;
  if(g.kind==='draughts'){const up=t=>(t.match(/[A-Z]/g)||[]).length,pr=g.hist[v-2]?g.hist[v-2].s:INIT('draughts');SND(up(e.s)>up(pr)?'dking':/[x:]/.test(e.n)?'dcapture':'dmove')}
  else SND(e.n.includes('=')?'promo':/[x:]/.test(e.n)?'capture':'move');
  if(e.n.endsWith('+'))setTimeout(()=>SND('check'),160);
  const end=$(`[data-sq="${e.t}"]`);
  if(/[x:]/.test(e.n)&&end)end.classList.add('burst');
  if(g.kind!=='chess')return;
  const m=/^O-O(-O)?/.exec(e.n);
  if(m){const k=e.t[1];slide(m[1]?'a'+k:'h'+k,m[1]?'d'+k:'f'+k,false)}
  if(e.n.includes('=')&&end&&end.firstElementChild)end.firstElementChild.animate([{transform:'scale(.3)'},{transform:'scale(1.25)',offset:.6},{transform:'scale(1)'}],{duration:380});
  if(e.n.endsWith('#'))$('#bd').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:420});
}

setInterval(()=>{
  const g=GM;if(!cur||!g||g.base==null)return;
  const c=clk(g),live=g.status==='play'&&g.hist.length>=2,t=g.hist.length%2?'b':'w';
  for(const s of['w','b']){const e=$(`[data-clk="${s}"]`);if(!e)continue;const v=fmt(c[s]);if(e.textContent!==v)e.textContent=v;e.classList.toggle('on',live&&s===t);e.classList.toggle('low',c[s]<20000)}
  if(live&&myCol(g)===t&&c[t]>0&&c[t]<10000){const s=Math.ceil(c[t]/1000);if(s!==lastTick){lastTick=s;SND('tick')}}
  chk(g);
},250);

/* ---------- магазин ---------- */
let BUSY=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const myStars=()=>{const m=P[ME.id];return m?m.stars|0:0};
async function api(action,extra){
  if(!inTG)throw new Error('Магазин работает внутри Telegram. Откройте игру через бота.');
  const r=await fetch('/.netlify/functions/bot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tgw.initData,action,...extra})});
  const j=await r.json().catch(()=>({}));
  if(!j.ok)throw new Error(j.error||'Не получилось. Попробуйте ещё раз.');
  return j;
}
function skPrev(k,t){
  if(k==='pool')return `<div class="prv cuep"><canvas class="cuec" data-cue="${t}" data-z="0"></canvas><canvas class="cuec" data-cue="${t}" data-z="1"></canvas></div>`;
  if(k==='chess'){const row=(c,o)=>['k','q','n'].map((p,i)=>`<div style="background:${(i+o)%2?'#b58863':'#f0d9b5'}">${pieceSvg(THM,t,p,c)}</div>`).join('');return `<div class="prv big"><div class="r">${row('w',0)}</div><div class="r">${row('b',1)}</div></div>`}
  const man=(c,kg,bg)=>`<div style="background:${bg}"><i class="ck sk ${c}${kg?' k':''}" style="${skStyle(t,c)}"></i></div>`;
  return `<div class="prv">${man('w',0,'#f0d9b5')}${man('b',0,'#b58863')}${man('w',1,'#f0d9b5')}${man('b',1,'#b58863')}</div>`;
}
function shop(){
  const m=P[ME.id]||{},pm=isPrem(m),fv=foreverP(m),own=m.owned||[],eq=m.eq||{};
  let h=inTG?'':'<div class="ban">Магазин работает только внутри Telegram. Откройте игру через бота.</div>';
  h+=`<div class="sc glass bal2"><div><small>Ваши звёзды</small><div class="big"><span class="gold">★</span> ${myStars()}</div></div><div class="earn"><b>Как заработать</b><small>Победа в рейтинговой партии: шахматы +4, шашки и бильярд +3, ничья +1.</small></div></div>`;
  const ttl=fv?'Премиум навсегда':pm?'Премиум до '+new Date(m.prem_until).toLocaleDateString('ru-RU'):'Премиум';
  const PL=[['prem_week','7 дней',''],['prem_month','30 дней','Выгодно'],['prem_life','один раз','Лучший']];
  h+=`<div class="hero"><div class="hh"><svg class="crn2" viewBox="0 0 24 24" aria-hidden="true"><use href="#crown"/></svg><div><b>${ttl}</b><small>${pm?'Золотая рамка, корона и цветное имя видны всем':'Золотая рамка, корона и цветное имя: все увидят, что вы с премиумом'}</small></div></div>
  <div class="plans">${PL.map(([id,sub,tag])=>{const it=SHOP[id];return `<div class="plan${id==='prem_life'?' best':''}">${tag?`<span class="tagc">${tag}</span>`:''}<b>${it.label}</b><div class="pr"><span class="gold">★</span> ${it.price}</div><small>${sub}</small><button class="${id==='prem_life'?'pri':''}" data-a="buy" data-v="${id}" ${fv?'disabled':''}>${pm&&id!=='prem_life'?'Продлить':'Получить'}</button></div>`}).join('')}</div>
  <div class="fsw">${FR_ORDER.map(f=>`<button data-a="equip" data-v="frame:${f}" ${pm?'':'disabled'} class="${(FRM[eq.frame]?eq.frame:'gold')===f?'on':''}" aria-label="${FRM[f].n}"><span class="sw" style="${frs(FRM[f].c)}"></span></button>`).join('')}</div>
  <div class="fnote">${pm?'Золотая рамка и корона показывают всем, что у вас премиум. Цвет внутреннего кольца можно выбрать.':'С премиумом у аватара появится золотая рамка и корона, а цвет внутреннего кольца можно выбрать.'}</div></div>`;
  for(const k of ['chess','dr','pool']){
    h+=`<h4>${k==='chess'?'Шахматные наборы':k==='dr'?'Шашки':'Кии'}</h4><div class="shop${k==='pool'?' one':''}">`+Object.keys(THM).map(t=>{
      const id=SKP[k][0]+'_'+t,it=SHOP[id],has=own.includes(id),on=eq[k]===id;
      const dsc=k==='pool'&&typeof Pool!=='undefined'&&Pool.CUES[t]?Pool.CUES[t].d:THM[t].d;
      return `<div class="sc glass">${skPrev(k,t)}<b>${THM[t].n}</b><span class="dsc">${dsc}</span>${has?`<button data-a="equip" data-v="${k}:${on?'':id}" class="${on?'pri':''}">${on?'Взято':'Взять'}</button>`:`<button data-a="buy" data-v="${id}"><span class="gold">★</span> ${it.price} · Получить</button>`}</div>`;
    }).join('')+'</div>';
  }
  return h+'<small style="color:var(--hint);text-align:center">Платных функций нет: всё получается за звёзды, заработанные победами. Премиум и скины меняют только внешний вид, их видят и соперники.</small>';
}
// Единственная оплата в игре: добровольное пожертвование звёздами Telegram, взамен ничего не выдаётся
function donate(n){
  if(!inTG)return msg('Пожертвовать можно внутри Telegram. Откройте игру через бота.');
  ask(`Отправить ${n} ★ на развитие проекта? Это добровольно и ничего не даёт взамен.`,async()=>{
    if(BUSY)return;BUSY=true;
    try{
      const{link}=await api('donate',{amount:n});BUSY=false;
      if(tgw.openInvoice&&tgw.isVersionAtLeast('6.1'))tgw.openInvoice(link,st=>{if(st==='paid')msg('Спасибо за поддержку проекта!');else if(st==='failed')msg('Оплата не прошла.')});
      else tgw.openTelegramLink(link);
    }catch(e){BUSY=false;msg(e.message)}
  });
}
async function spend(id){
  if(BUSY)return;BUSY=true;
  try{await api('buy',{item:id});SND('promo');await refresh()}catch(e){msg(e.message)}
  BUSY=false;
}
function buy(id){
  const it=SHOP[id],m=P[ME.id]||{};if(!it)return;
  if(!inTG)return msg('Магазин работает внутри Telegram. Откройте игру через бота.');
  if(it.kind==='premium'&&foreverP(m))return msg('У вас уже премиум навсегда.');
  if(myStars()<it.price)return msg(`Не хватает звёзд: нужно ${it.price} ★, у вас ${myStars()} ★. Звёзды дают за победы в рейтинговых партиях.`);
  ask(`Взять «${itemName(it)}» за ${it.price} ★?`,()=>spend(id));
}
async function equip(slot,id){
  if(BUSY)return;
  try{
    await api('equip',{slot,item:id});
    const m=P[ME.id];if(m){m.eq={...(m.eq||{})};if(id)m.eq[slot]=id;else delete m.eq[slot]}
    paint();refresh();
  }catch(e){msg(e.message)}
}

/* ---------- события ---------- */
app.onclick=async e=>{
  const q=e.target.closest('[data-sq]');if(q)return tap(q.dataset.sq);
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,g=GM,col=g&&myCol(g);
  if(a==='hop')hop(b);
  else if(a==='tab'){tab=v;paint();if(v==='rank')loadRank().then(ch=>ch&&tab==='rank'&&!cur&&paint())}
  else if(a==='rk'){rk=v;paint();loadRank().then(ch=>ch&&rk===v&&tab==='rank'&&!cur&&paint())}
  else if(a==='tc'){TC=+v;lset('ch_tc',TC);paint()}
  else if(a==='th'){th=+v;lset('ch_th',th);paint()}
  else if(a==='ps'){ps=+v;lset('ch_ps',ps);paint()}
  else if(a==='promo'){const{g:pg,s:psn,col:pcol,os}=PR,o=os.find(o=>o.m.promotion===v);PR=null;if(o)doMove(pg,psn,pcol,o);else paint()}
  else if(a==='pcancel'){PR=null;sel=null;opts=[];paint()}
  else if(a==='buy')buy(v);
  else if(a==='equip'){const k=v.indexOf(':');equip(v.slice(0,k),v.slice(k+1))}
  else if(a==='don')donate(+v);
  else if(a==='new')create(v);
  else if(a==='open')openGame(v);
  else if(a==='accept')accept(v);
  else if(a==='back'){cur=null;GM=null;paint();refresh();sched()}
  else if(a==='prev'||a==='next'){const N=g.hist.length,c=vw===null?N:vw;vw=Math.max(0,Math.min(N,c+(a==='next'?1:-1)));if(vw===N)vw=null;sel=null;opts=[];paint()}
  else if(a==='goto'){vw=+v>=g.hist.length?null:+v;sel=null;opts=[];paint()}
  else if(a==='draw')await db.from('games').update({draw_by:col}).eq('id',cur);
  else if(a==='dno')await db.from('games').update({draw_by:null}).eq('id',cur);
  else if(a==='dyes')finish('d');
  else if(a==='resign')ask('Сдаться?',()=>finish(col==='w'?'b':'w'));
  else if(a==='cancel'){const id=cur;await db.from('games').delete().eq('id',id);G=G.filter(x=>x.id!==id);cur=null;GM=null;paint();refresh()}
};
app.onchange=e=>{if(e.target.id==='rt')RATED=e.target.checked;if(e.target.id==='nt'){NOTIFY=e.target.checked;lset('ch_nt',NOTIFY?1:0)}if(e.target.id==='sn')try{Snd.set('on',e.target.checked)}catch(x){}if(e.target.id==='sv')try{Snd.set('vib',e.target.checked)}catch(x){}if(e.target.id==='nm')db.from('players').update({notify:e.target.checked}).eq('id',ME.id).then(()=>refresh())};

if(SB_URL.includes('ВСТАВЬТЕ'))app.innerHTML='<div class="ban">Откройте index.html на GitHub, нажмите на карандаш и вставьте адрес проекта Supabase и ключ anon в начале скрипта.</div>';
else init();
</script>
